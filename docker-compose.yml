services:
  actual-server:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    volumes:
      - actual-server-data:/data
    ports:
      - "5006:5006"

  reports:
    build: .
    restart: unless-stopped
    depends_on:
      - actual-server
    ports:
      - "3000:3000"
    environment:
      ACTUAL_SERVER_URL: http://actual-server:5006
      ACTUAL_SERVER_PASSWORD: ${ACTUAL_SERVER_PASSWORD}
      ACTUAL_SYNC_ID: ${ACTUAL_SYNC_ID}
      ACTUAL_E2E_PASSWORD: ${ACTUAL_E2E_PASSWORD:-}
      ACTUAL_DATA_DIR: /data/actual-cache
      SETTINGS_PATH: /data/settings.json
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
    volumes:
      - reports-data:/data

volumes:
  actual-server-data:
  reports-data:
